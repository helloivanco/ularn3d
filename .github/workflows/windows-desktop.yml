name: Windows desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['desktop-v*']
  pull_request:
    paths:
      - 'desktop/**'
      - 'tests/desktop*'
      - 'package*.json'
      - '.github/workflows/windows-desktop.yml'
      - 'scripts/publish-windows-release.mjs'
      - 'scripts/app-version.mjs'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:desktop
      - run: npm run desktop:package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run desktop:verify:portable
      - uses: actions/upload-artifact@v4
        with:
          name: Ularn-Windows-x64
          path: |
            release/*.exe
            release/*.exe.sha256
          if-no-files-found: error
      - name: Publish versioned Windows download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-windows-release.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-test-results
          path: test-results/
