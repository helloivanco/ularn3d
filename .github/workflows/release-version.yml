name: Release version

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: git fetch origin ${{ github.base_ref }}
      - run: npm run test:version
        env:
          VERSION_BASE: origin/${{ github.base_ref }}
